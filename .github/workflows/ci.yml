name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/training-agent/requirements.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Training Backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r services/training-agent/requirements.txt

      - name: Run tests
        run: npm test

      - name: Run Training Backend tests
        run: npm run test:agent

      - name: Validate Training Backend evaluation cases
        working-directory: services/training-agent
        run: python -m evaluation.cli list-cases --cases evaluation/cases/skills.jsonl

      - name: Compile Training Backend Python modules
        working-directory: services/training-agent
        run: python -m compileall -q agent app domain evaluation fit integrations operations services storage worker

      - name: Check route demo JavaScript syntax
        run: |
          node --check demos/training-agent-route/demo/global_cycling_router/web/app.js
          node --check demos/training-agent-route/demo/gaode_cycling_router/web/app.js
          node --check demos/training-agent-route/demo/gaode_cycling_router/web/bootstrap.js
          node --check demos/training-agent-route/demo/osm_cycling_router/web/app.js

      - name: Run standalone route demo tests
        working-directory: demos/training-agent-route
        run: python -m pytest -q demo

      - name: Run Rider to Training Backend integration test
        run: npm run test:integration
