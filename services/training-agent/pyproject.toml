[project]
name = "personal-fit-agent"
version = "0.1.0"
description = "Local FIT download, LLM analysis, guided chat, and Strava upload"
requires-python = ">=3.12"
dependencies = [
  "fitdecode>=0.11.0",
  "garminconnect>=0.2.25",
  "fastapi>=0.110.0",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27.0,<1.0.0",
  "osmium>=3.7.0",
  "uvicorn>=0.27.0",
  "typer>=0.9.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
  "jsonschema>=4.18.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "setuptools>=68", "wheel", "packaging"]

[project.scripts]
fit-agent = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["settings", "project_paths", "observability", "runtime_data_migration"]

[tool.setuptools.package-data]
"agent.skills" = ["library/**/*.md"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agent", "agent.*", "app", "app.*", "domain", "domain.*",
  "evaluation", "evaluation.*", "fit", "fit.*", "integrations", "integrations.*",
  "operations", "operations.*", "services", "services.*", "storage", "storage.*",
  "worker", "worker.*",
]
namespaces = false
