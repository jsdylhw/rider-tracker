[project]
name = "personal-fit-agent"
version = "0.1.0"
description = "Local FIT download, LLM analysis, guided chat, and Strava upload"
requires-python = ">=3.12"
dependencies = [
  "fitdecode>=0.11.0",
  "garminconnect>=0.2.25",
  "fastapi>=0.110.0",
  "httpx>=0.27.0,<1.0.0",
  "osmium>=3.7.0",
  "uvicorn>=0.27.0",
  "typer>=0.9.0",
  "pandas>=2.0.0",
  "pyyaml>=6.0",
  "requests>=2.31.0",
]

[project.scripts]
fit-agent = "app.cli:app"
